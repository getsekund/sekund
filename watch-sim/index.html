<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SEKUND watch simulator: Secure Mode, PIN, transaction review and approval on Solana devnet." />
    <link rel="preload" href="/fonts/DSEG7Classic-BoldItalic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/DSEG14Classic-BoldItalic.woff2" as="font" type="font/woff2" crossorigin />
    <title>SEKUND watch simulator</title>
    <script>
      (function () {
        try {
          var c = localStorage.getItem("sekund-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = c === "dark" || (c !== "light" && systemDark);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
